<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kukui">
  <title>Kukui</title>
  <defs>
    <!-- Dark-mode variant of kukui-logo.svg: the body is warm tan instead of
         dark brown so the silhouette reads on the disc + dark substrate.
         Lighting (upper-left) preserved; lit stop cream-tan, shadow chestnut. -->
    <radialGradient id="kukui-body" cx="32%" cy="28%" r="64%">
      <stop offset="0%" stop-color="#e3c4a0"/>
      <stop offset="55%" stop-color="#a07954"/>
      <stop offset="100%" stop-color="#5d3f28"/>
    </radialGradient>
    <!-- Specular highlight bumped from tan to cream so it still pops
         against the lighter body. -->
    <radialGradient id="kukui-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e4cc" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f5e4cc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5e4cc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="kukui-clip">
      <path d="M24 6 C 16 7, 8 15, 6 26 C 4 39, 12 57, 32 60 C 52 57, 60 39, 58 26 C 56 15, 48 7, 40 6 C 37 8, 35 13, 32 14 C 29 13, 27 8, 24 6 Z"/>
    </clipPath>
  </defs>

  <!-- Simple sage ring (brand green) framing the drupe. -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#4a7a5f" stroke-width="3"/>

  <svg x="22" y="22" width="56" height="56" viewBox="-5 -5 74 74" overflow="visible">
    <g transform="rotate(35 32 32)">
      <path d="M24 6 C 16 7, 8 15, 6 26 C 4 39, 12 57, 32 60 C 52 57, 60 39, 58 26 C 56 15, 48 7, 40 6 C 37 8, 35 13, 32 14 C 29 13, 27 8, 24 6 Z" fill="url(#kukui-body)"/>
      <g clip-path="url(#kukui-clip)">
        <ellipse cx="22" cy="22" rx="16" ry="9" fill="url(#kukui-gloss)" transform="rotate(-25 22 22)"/>
      </g>
      <!-- Seam darkened so it remains legible on the lighter body. -->
      <path d="M32 16 C 30 24, 34 30, 32 38 C 30 46, 34 52, 32 56" stroke="#5d3f28" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </g>
  </svg>
</svg>
