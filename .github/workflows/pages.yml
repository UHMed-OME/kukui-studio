# Builds Kukui Studio + live-mode and publishes both to GitHub Pages on
# every push to main. Studio sits at the apex (kukuistudio.com); live-mode
# is mounted at /live/ so Studio's "Launch in Kukui Live" buttons resolve
# correctly without an extra deploy. Engine-web is still SCORM-only.
name: Deploy Studio + live-mode to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build engine bundles (consumed by SCORM templates)
        run: pnpm --filter @kukui/engine-web build

      - name: Pack SCORM templates
        run: node packaging/pack-scorm.js --all

      - name: Stage SCORM templates into Studio public dir
        # Studio fetches /scorm-templates/kukui-<kind>.scorm.zip at download
        # time, so the templates need to live inside the deployed bundle.
        run: |
          mkdir -p apps/studio-app/public/scorm-templates
          cp packaging/build/*.scorm.zip apps/studio-app/public/scorm-templates/

      - name: Compute Pages base path
        # Pages serves the studio at the apex of the custom domain
        # kukuistudio.com, so Vite's base must be "/" (not "/<repo>/").
        run: echo "KUKUI_BASE=/" >> "$GITHUB_ENV"

      - name: Build Studio
        env:
          # Google Drive integration. Optional — when secrets aren't set,
          # the Drive UI hides itself client-side (driveEnabled() returns
          # false because the values land as empty strings in the bundle).
          # Add these in Settings → Secrets and variables → Actions →
          # "Repository secrets" once the Google Cloud OAuth client is
          # registered. Both are public values by design (the Client ID
          # ships in every browser; the API key is restricted to the
          # Picker API in the Cloud Console), but storing in secrets keeps
          # them out of the public git log.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Project NUMBER (12-digit, not project ID). Required for the
          # Picker to filter to files our app created under drive.file
          # scope — without it the Picker shows nothing on Open.
          VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          # Sketchfab integration. Optional — when the secret isn't set,
          # the Sketchfab UI hides itself client-side. Public OAuth Client
          # ID, safe to ship in the bundle; protected by Sketchfab's
          # redirect URI binding (configured at
          # https://kukuistudio.com/auth/sketchfab/callback). The Sketchfab
          # Client Secret is intentionally NOT injected — Implicit grant
          # doesn't use it, and shipping it would defeat the purpose.
          VITE_SKETCHFAB_CLIENT_ID: ${{ secrets.SKETCHFAB_CLIENT_ID }}
        run: pnpm --filter @kukui/studio-app build

      - name: Build live-mode (served at /live/)
        env:
          # live-mode's vite config reads KUKUI_LIVE_BASE if set, otherwise
          # `/live/` — matches where Studio's launcher buttons point.
          KUKUI_LIVE_BASE: /live/
          # Short commit SHA — surfaced in the live activity footer so
          # learners + instructors can report which build they're on.
          VITE_KUKUI_VERSION: ${{ github.sha }}
        run: pnpm --filter @kukui/live-mode build

      - name: Stage live-mode under studio/dist/live/
        run: |
          mkdir -p apps/studio-app/dist/live
          cp -R apps/live-mode/dist/. apps/studio-app/dist/live/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
